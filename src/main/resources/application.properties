spring.application.name=secure-api
server.port=8080

# --- База данных H2 в памяти ---
spring.datasource.url=jdbc:h2:mem:securedb
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Локальные секреты читаем из файла .env (он НЕ попадает в git). optional = файла может не быть
spring.config.import=optional:file:.env[.properties]

# Секреты - только из окружения / .env. Значений по умолчанию НЕТ:
# если переменная не задана, приложение упадёт при старте (fail fast)
app.demo.admin-password=${DEMO_ADMIN_PASSWORD}
app.demo.user-password=${DEMO_USER_PASSWORD}
app.jwt.secret=${JWT_SECRET}

# Короткое время жизни токена (минуты)
app.jwt.ttl-minutes=15

# --- Не раскрывать детали ошибок клиенту ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
